<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CJEU Judgement Parser Demo</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; max-width: 1400px; margin: 0 auto; padding: 20px; }
    h1 { color: #1a365d; }
    .container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .panel { border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; }
    .panel h2 { margin-top: 0; font-size: 1.1rem; color: #4a5568; }
    textarea { width: 100%; height: 300px; font-family: monospace; font-size: 12px; }
    button { background: #3182ce; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 14px; }
    button:hover { background: #2c5282; }
    .stats { display: flex; gap: 16px; flex-wrap: wrap; margin: 16px 0; }
    .stat { background: #edf2f7; padding: 8px 16px; border-radius: 6px; }
    .stat-value { font-size: 1.5rem; font-weight: bold; color: #2d3748; }
    .stat-label { font-size: 0.75rem; color: #718096; }
    .section { margin: 16px 0; }
    .section h3 { font-size: 0.9rem; color: #4a5568; margin-bottom: 8px; }
    .item { background: #f7fafc; padding: 12px; margin: 8px 0; border-radius: 6px; border-left: 4px solid #3182ce; }
    .item-header { font-weight: 600; color: #2d3748; }
    .item-meta { font-size: 0.8rem; color: #718096; margin-top: 4px; }
    .topics { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; }
    .topic { background: #bee3f8; color: #2c5282; padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; }
    .match { margin-top: 8px; padding: 8px; background: #c6f6d5; border-radius: 4px; font-size: 0.85rem; }
    .match.low { background: #feebc8; }
    pre { background: #1a202c; color: #e2e8f0; padding: 16px; border-radius: 8px; overflow-x: auto; font-size: 11px; max-height: 400px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab { padding: 8px 16px; border: 1px solid #e2e8f0; border-radius: 6px; cursor: pointer; }
    .tab.active { background: #3182ce; color: white; border-color: #3182ce; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body>
  <h1>CJEU Judgement Parser</h1>
  <p>Paste a CJEU judgement below to extract headings, questions, and rulings.</p>

  <div class="container">
    <div class="panel">
      <h2>Input</h2>
      <textarea id="input" placeholder="Paste judgement text here..."></textarea>
      <br><br>
      <button onclick="parseJudgement()">Parse Judgement</button>
      <button onclick="loadSample()">Load Sample</button>
    </div>

    <div class="panel">
      <h2>Results</h2>
      <div id="results">
        <p style="color: #718096;">Parse a judgement to see results...</p>
      </div>
    </div>
  </div>

  <script src="cjeu-judgement-parser.js"></script>
  <script>
    const parser = new CJEUJudgementParser();

    function parseJudgement() {
      const input = document.getElementById('input').value;
      if (!input.trim()) {
        alert('Please paste a judgement first');
        return;
      }

      const result = parser.parse(input);
      displayResults(result);
    }

    function displayResults(result) {
      const container = document.getElementById('results');

      // Stats
      let html = `
        <div class="stats">
          <div class="stat">
            <div class="stat-value">${result.stats.totalHeadings}</div>
            <div class="stat-label">Headings</div>
          </div>
          <div class="stat">
            <div class="stat-value">${result.stats.questionCount}</div>
            <div class="stat-label">Questions</div>
          </div>
          <div class="stat">
            <div class="stat-value">${result.stats.rulingCount}</div>
            <div class="stat-label">Rulings</div>
          </div>
        </div>

        <div class="tabs">
          <div class="tab active" onclick="switchTab('rulings')">Rulings</div>
          <div class="tab" onclick="switchTab('questions')">Questions</div>
          <div class="tab" onclick="switchTab('headings')">Headings</div>
          <div class="tab" onclick="switchTab('json')">JSON</div>
        </div>
      `;

      // Rulings tab
      html += `<div id="tab-rulings" class="tab-content active"><div class="section">`;
      for (const r of result.rulings) {
        const confClass = r.matchConfidence < 0.5 ? 'low' : '';
        html += `
          <div class="item">
            <div class="item-header">Ruling ${r.number}</div>
            <div class="item-meta">${r.articleReference.substring(0, 100)}...</div>
            <div class="topics">
              ${r.topics.map(t => `<span class="topic">${t}</span>`).join('')}
            </div>
            <div class="match ${confClass}">
              <strong>Matched:</strong> Question${r.matchedQuestions.length > 1 ? 's' : ''} ${r.matchedQuestions.join(', ') || 'None'}
              <br><small>Confidence: ${(r.matchConfidence * 100).toFixed(0)}% (${r.matchMethod})</small>
            </div>
          </div>
        `;
      }
      html += `</div></div>`;

      // Questions tab
      html += `<div id="tab-questions" class="tab-content"><div class="section">`;
      for (const q of result.questions) {
        html += `
          <div class="item">
            <div class="item-header">${q.header}</div>
            <div class="item-meta">Questions: ${q.questionNumbers.join(', ')} | Lines: ${q.startLine}-${q.endLine}</div>
            <div class="topics">
              ${q.topics.map(t => `<span class="topic">${t}</span>`).join('')}
            </div>
            <div class="item-meta">Articles: ${q.articles.join(', ') || 'None detected'}</div>
          </div>
        `;
      }
      html += `</div></div>`;

      // Headings tab
      html += `<div id="tab-headings" class="tab-content"><div class="section">`;
      for (const h of result.headings) {
        html += `
          <div class="item" style="border-left-color: ${h.level === 2 ? '#e53e3e' : h.level === 3 ? '#dd6b20' : '#38a169'}">
            <div class="item-header">${'#'.repeat(h.level)} ${h.text}</div>
            <div class="item-meta">Line ${h.line + 1} | Type: ${h.type}</div>
          </div>
        `;
      }
      html += `</div></div>`;

      // JSON tab
      const jsonOutput = {
        stats: result.stats,
        rulings: result.rulings.map(r => ({
          number: r.number,
          matchedQuestions: r.matchedQuestions,
          matchConfidence: r.matchConfidence,
          matchMethod: r.matchMethod,
          topics: r.topics,
          articles: r.articles
        })),
        questions: result.questions.map(q => ({
          header: q.header,
          questionNumbers: q.questionNumbers,
          topics: q.topics,
          articles: q.articles
        }))
      };
      html += `<div id="tab-json" class="tab-content"><pre>${JSON.stringify(jsonOutput, null, 2)}</pre></div>`;

      container.innerHTML = html;
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelector(`.tab[onclick*="${tabId}"]`).classList.add('active');
      document.getElementById(`tab-${tabId}`).classList.add('active');
    }

    function loadSample() {
      // Load a sample excerpt
      document.getElementById('input').value = `JUDGMENT OF THE COURT (Third Chamber)

20 June 2024

In Case C-590/22,

REQUEST for a preliminary ruling under Article 267 TFEU from the Amtsgericht Wesel (Local Court, Wesel, Germany)

THE COURT (Third Chamber),

gives the following

Judgment

1 This request for a preliminary ruling concerns the interpretation of Article 82(1) of Regulation (EU) 2016/679 (the GDPR).

2 The request has been made in proceedings concerning the right to be awarded damages under Article 82(1) of the GDPR.

Legal context

3 Recitals 85, 146 and 148 of the GDPR are worded as follows...

The dispute in the main proceedings and the questions referred for a preliminary ruling

8 The applicants in the main proceedings are clients of PS, a tax consultancy firm.

19 In those circumstances, the court decided to refer the following questions:

'(1) Is it sufficient for the establishment of a claim for compensation under Article 82(1) of the GDPR that a provision has been infringed?

(2) Under EU law, does the establishment of a claim require an adverse effect of a certain magnitude?

(3) Is it sufficient that the claimant fears that his or her personal data have come into the hands of third parties?

(4) Is it in conformity with EU law to apply mutatis mutandis the criteria of Article 83(2)?

(5) Must the amount also be assessed by reference to deterrent effect?

(6) Is it in conformity with EU law to take into account simultaneous infringements of national provisions?'

Consideration of the questions referred

The first and second questions

20 By its first and second questions, the referring court asks whether Article 82(1) of the GDPR must be interpreted as meaning that an infringement is sufficient to give rise to a right to compensation.

28 In the light of the foregoing, the answer to the first and second questions is that Article 82(1) of the GDPR must be interpreted as meaning that an infringement of that regulation is not, in itself, sufficient to give rise to a right to compensation under that provision.

The third question

29 By its third question, the referring court asks whether a person's fear that personal data have been disclosed is sufficient to give rise to a right to compensation.

36 In the light of the foregoing, the answer to the third question is that Article 82(1) of the GDPR must be interpreted as meaning that a person's fear is sufficient to give rise to a right to compensation, provided that that fear is duly proven.

The fourth and fifth questions

37 By its fourth and fifth questions, the referring court asks whether the criteria in Article 83 should be applied and whether compensation should have a dissuasive function.

44 In the light of the foregoing, the answer to the fourth and fifth questions is that Article 82(1) of the GDPR must be interpreted as meaning that it is not necessary to apply the criteria in Article 83 or to confer a dissuasive function.

The sixth question

45 By its sixth question, the referring court asks whether account must be taken of simultaneous infringements of national provisions.

50 In the light of the foregoing, the answer to the sixth question is that Article 82(1) of the GDPR must be interpreted as meaning that it is not necessary to take account of simultaneous infringements of national provisions.

Costs

51 Since these proceedings are a step in the action pending before the referring court, the decision on costs is a matter for that court.

On those grounds, the Court (Third Chamber) hereby rules:

1. Article 82(1) of Regulation (EU) 2016/679

must be interpreted as meaning that an infringement of that regulation is not, in itself, sufficient to give rise to a right to compensation. The data subject must also establish the existence of damage.

2. Article 82(1) of Regulation 2016/679

must be interpreted as meaning that a person's fear is sufficient to give rise to a right to compensation, provided that that fear is duly proven.

3. Article 82(1) of Regulation 2016/679

must be interpreted as meaning that it is not necessary to apply mutatis mutandis the criteria in Article 83 or to confer a dissuasive function.

4. Article 82(1) of Regulation 2016/679

must be interpreted as meaning that it is not necessary to take account of simultaneous infringements of national provisions.

[Signatures]`;
      parseJudgement();
    }
  </script>
</body>
</html>
