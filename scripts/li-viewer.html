    <style>
        :root {
            --bg-0: #09090b;
            --bg-1: #0f0f12;
            --bg-2: #18181b;
            --bg-3: #27272a;
            --border: #3f3f46;
            --border-light: #52525b;
            --text-0: #fafafa;
            --text-1: #d4d4d8;
            --text-2: #a1a1aa;
            --text-3: #71717a;
            --accent: #3b82f6;
            --accent-hover: #60a5fa;
            --green: #22c55e;
            --red: #ef4444;
            --amber: #f59e0b;
            --purple: #a855f7;
            --cyan: #06b6d4;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg-0);
            color: var(--text-1);
            font-family: 'IBM Plex Sans', -apple-system, sans-serif;
            line-height: 1.5;
            font-size: 14px;
        }

        .mono { font-family: 'IBM Plex Mono', monospace; }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-1); }
        ::-webkit-scrollbar-thumb { background: var(--bg-3); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--border); }

        input, select, button { font-family: inherit; font-size: inherit; }

        input[type="text"], input[type="search"], input[type="number"], select {
            background: var(--bg-2);
            border: 1px solid var(--border);
            color: var(--text-1);
            padding: 8px 12px;
            border-radius: 6px;
            outline: none;
            transition: border-color 0.15s;
        }
        input:focus, select:focus { border-color: var(--accent); }

        .btn {
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            border: 1px solid transparent;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-ghost { background: transparent; border-color: var(--border); color: var(--text-1); }
        .btn-ghost:hover { border-color: var(--text-2); background: var(--bg-2); }
        .btn-sm { padding: 4px 10px; font-size: 12px; }

        .tag {
            display: inline-flex;
            align-items: center;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
            font-family: 'IBM Plex Mono', monospace;
            letter-spacing: 0.3px;
            transition: all 0.15s;
            border: 1px solid transparent;
        }

        .tag-yes { background: rgba(34, 197, 94, 0.15); color: var(--green); border-color: rgba(34, 197, 94, 0.3); }
        .tag-no { background: rgba(239, 68, 68, 0.15); color: var(--red); border-color: rgba(239, 68, 68, 0.3); }
        .tag-unclear { background: rgba(245, 158, 11, 0.15); color: var(--amber); border-color: rgba(245, 158, 11, 0.3); }
        .tag-na { background: rgba(113, 113, 122, 0.15); color: var(--text-2); border-color: rgba(113, 113, 122, 0.3); }

        .tag-dc { background: rgba(239, 68, 68, 0.15); color: var(--red); border-color: rgba(239, 68, 68, 0.3); }
        .tag-ds { background: rgba(34, 197, 94, 0.15); color: var(--green); border-color: rgba(34, 197, 94, 0.3); }
        .tag-mixed { background: rgba(245, 158, 11, 0.15); color: var(--amber); border-color: rgba(245, 158, 11, 0.3); }
        .tag-neutral { background: rgba(113, 113, 122, 0.15); color: var(--text-2); border-color: rgba(113, 113, 122, 0.3); }

        .tag-concept { background: rgba(6, 182, 212, 0.1); color: var(--cyan); border-color: rgba(6, 182, 212, 0.2); }
        .tag-charter { background: rgba(168, 85, 247, 0.1); color: #c084fc; border-color: rgba(168, 85, 247, 0.2); }
        .tag-bool { background: rgba(59, 130, 246, 0.1); color: #60a5fa; border-color: rgba(59, 130, 246, 0.2); }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            background: var(--bg-2);
            border: 1px solid var(--border);
            border-radius: 16px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s;
            user-select: none;
        }
        .chip:hover { border-color: var(--text-3); }
        .chip.active { background: rgba(59, 130, 246, 0.15); border-color: var(--accent); color: var(--accent); }
        .chip .count { color: var(--text-3); font-size: 11px; }

        .toggle {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: var(--bg-2);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .toggle:hover { border-color: var(--text-3); }
        .toggle.active { background: rgba(59, 130, 246, 0.1); border-color: var(--accent); }
        .toggle-indicator {
            width: 32px;
            height: 18px;
            background: var(--bg-3);
            border-radius: 9px;
            position: relative;
            transition: background 0.15s;
            flex-shrink: 0;
        }
        .toggle.active .toggle-indicator { background: var(--accent); }
        .toggle-indicator::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 14px;
            height: 14px;
            background: white;
            border-radius: 50%;
            transition: transform 0.15s;
        }
        .toggle.active .toggle-indicator::after { transform: translateX(14px); }

        .card {
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        .case-card {
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 8px;
            transition: all 0.2s;
        }
        .case-card:hover { border-color: var(--border-light); }
        .case-card.expanded { border-color: var(--accent); }

        .quote {
            border-left: 3px solid var(--accent);
            padding-left: 12px;
            margin: 8px 0;
            color: var(--text-2);
            font-style: italic;
            font-size: 13px;
        }

        .section-label {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-3);
            margin-bottom: 8px;
        }

        .stat-bar {
            height: 6px;
            background: var(--bg-3);
            border-radius: 3px;
            overflow: hidden;
        }
        .stat-bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        .section-block {
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .section-block-header {
            padding: 10px 14px;
            background: var(--bg-2);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 600;
            transition: background 0.15s;
        }
        .section-block-header:hover { background: var(--bg-3); }
        .section-block-body {
            padding: 14px;
            border-top: 1px solid var(--border);
        }

        .nested-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .nested-table th, .nested-table td {
            padding: 8px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        .nested-table th {
            font-weight: 600;
            color: var(--text-2);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: var(--bg-2);
        }
        .nested-table tr:last-child td { border-bottom: none; }
        .nested-table tr:hover td { background: rgba(59, 130, 246, 0.03); }

        .option-group { margin-bottom: 20px; }
        .option-group-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-3);
            margin-bottom: 10px;
        }
        .option-chips { display: flex; flex-wrap: wrap; gap: 8px; }
        .option-chip {
            padding: 6px 14px;
            background: var(--bg-2);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .option-chip:hover { border-color: var(--text-3); }
        .option-chip.selected { background: rgba(59, 130, 246, 0.15); border-color: var(--accent); color: var(--accent); }

        .checkbox-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            cursor: pointer;
        }
        .checkbox-option input {
            width: 18px;
            height: 18px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-content {
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 12px;
            max-width: 800px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
        }
        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .modal-body { padding: 24px; }
        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .report-preview {
            background: white;
            color: #1a1a1a;
            padding: 24px;
            border-radius: 8px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Crimson Pro', Georgia, serif;
            font-size: 14px;
            line-height: 1.6;
        }
        .report-preview h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; font-family: 'Source Serif 4', Georgia, serif; }
        .report-preview h2 { font-size: 16px; font-weight: 600; margin: 16px 0 8px; color: #333; border-bottom: 1px solid #ddd; padding-bottom: 4px; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-in { animation: fadeIn 0.2s ease; }
    </style>

        const FIELD_SECTIONS = {
            'S0: Overview': ['case_number', 'case_date', 'factual_summary', 'li_discussed'],

        const PRESETS = {

        const ReportBuilder = ({ cases, allCases, isOpen, onClose }) => {
            const [config, setConfig] = useState({

            const reportCases = useMemo(() => {

            const groupedCases = useMemo(() => {

            const generateReportHTML = () => {
                const fontFamily = config.fontStyle === 'serif'

                const fieldHTML = (c, field) => {

                    // Parsed array fields — render as tags

                return `<!DOCTYPE html>

<title>CJEU Legitimate Interest Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</style></head><body>

</div></div>
<main>${groupsHTML}</main>

CJEU Legitimate Interest Analyzer | ${reportCases.length} cases
</footer></body></html>`;

                                )

                        ),

                        // Preview
                        React.createElement('div', { className: 'p-4 bg-zinc-800/50 rounded-lg' },

                            ),

                                React.createElement('p', { style: { color: '#666', fontSize: '13px', marginBottom: '12px' } }, `${reportCases.length} cases, ${config.fields.length} fields`),
                                groupedCases.slice(0, 2).map(group => React.createElement('div', { key: group.key },
                                    config.groupBy !== 'none' && React.createElement('h2', null, `${group.label} (${group.items.length})`),
                                    group.items.slice(0, 2).map(c => React.createElement('div', {
                                        key: c.case_number,
                                        style: { margin: '8px 0', paddingLeft: '12px', borderLeft: '3px solid #3b82f6' }
                                    },
                                        React.createElement('div', { style: { fontFamily: "'IBM Plex Mono', monospace", fontSize: '11px', color: '#666' } },
                                            `${c.case_number} | ${c.case_date} | ${conclusionLabel(c.li_valid_basis)}`
                                        ),
                                        React.createElement('div', { style: { fontSize: '13px', marginTop: '4px' } },
                                            c.key_holdings_summary ? c.key_holdings_summary.slice(0, 120) + '...' : c.factual_summary?.slice(0, 120) + '...'
                                        )
                                    )),
                                    group.items.length > 2 && React.createElement('div', { style: { color: '#888', fontSize: '12px', fontStyle: 'italic' } }, `...and ${group.items.length - 2} more`)
                                )),
                                groupedCases.length > 2 && React.createElement('div', { style: { color: '#888', fontSize: '12px', marginTop: '8px' } }, `...and ${groupedCases.length - 2} more groups`)
                            )
                        )
                    ),
                    React.createElement('div', { className: 'modal-footer' },
                        React.createElement('button', { className: 'btn btn-ghost', onClick: onClose }, 'Cancel'),
                        React.createElement('button', { className: 'btn btn-primary', onClick: openReport }, 'Open Report')
                    )
                )
            );
        };

        // ============================================================================
        // APP
        // ============================================================================
        const App = () => {
            const [data, setData] = useState(CASE_DATA);
            const [filters, setFilters] = useState({
                search: '', conclusions: [], sides: [], bools: {},
                yearMin: null, yearMax: null,
            });
            const [expanded, setExpanded] = useState(new Set());
            const [view, setView] = useState('browse');
            const [sortBy, setSortBy] = useState('date_asc');
            const [showReport, setShowReport] = useState(false);
            const [showStats, setShowStats] = useState(true);

            const allCases = data;

            const filteredCases = useMemo(() => allCases.filter(c => {
                if (filters.search) {
                    const q = filters.search.toLowerCase();
                    const text = [
                        c.case_number, c.factual_summary, c.key_holdings_summary,
                        c.controller_interests, c.interest_findings, c.necessity_discussed,
                        c.factual_assumptions_interest, c.factual_assumptions_necessity,
                        c.factual_assumptions_balancing, c.controller_side_interests,
                        c.ds_side_interests, c.charter_articles, c.expectations_detail,
                    ].filter(Boolean).join(' ').toLowerCase();
                    if (!text.includes(q)) return false;
                }
                if (filters.conclusions.length && !filters.conclusions.includes(c.li_valid_basis)) return false;
                if (filters.sides.length && !filters.sides.includes(c.prevailing_side)) return false;
                const b = filters.bools || {};
                if (b.li_discussed && !isYes(c.li_discussed)) return false;
                if (b.strict_necessity && !isYes(c.strict_necessity)) return false;
                if (b.less_effective_means && !isYes(c.less_effective_means)) return false;
                if (b.charter_invoked && !isYes(c.charter_invoked)) return false;
                if (b.reasonable_expectations && !isYes(c.reasonable_expectations)) return false;
                if (b.necessity_found_y && c.necessity_found !== 'Y') return false;
                if (b.balancing_discussed && !isYes(c.balancing_discussed)) return false;
                const year = getYear(c.case_date);
                if (filters.yearMin && year && year < filters.yearMin) return false;
                if (filters.yearMax && year && year > filters.yearMax) return false;
                return true;
            }), [allCases, filters]);

            const sortedCases = useMemo(() => {
                const s = [...filteredCases];
                if (sortBy === 'date_asc') s.sort((a, b) => (a.case_date || '').localeCompare(b.case_date || ''));
                else if (sortBy === 'date_desc') s.sort((a, b) => (b.case_date || '').localeCompare(a.case_date || ''));
                else if (sortBy === 'case') s.sort((a, b) => a.case_number.localeCompare(b.case_number));
                else if (sortBy === 'conclusion') {
                    const o = { 'Y': 0, 'N': 1, 'unclear': 2 };
                    s.sort((a, b) => (o[a.li_valid_basis] ?? 99) - (o[b.li_valid_basis] ?? 99));
                }
                return s;
            }, [filteredCases, sortBy]);

            const toggle = useCallback(id => setExpanded(p => {
                const n = new Set(p);
                n.has(id) ? n.delete(id) : n.add(id);
                return n;
            }), []);

            const upload = e => {
                const file = e.target.files[0];
                if (!file) return;
                const r = new FileReader();
                r.onload = evt => {
                    try {
                        const parsed = JSON.parse(evt.target.result);
                        setData(Array.isArray(parsed) ? parsed : [parsed]);
                        setFilters({ search: '', conclusions: [], sides: [], bools: {}, yearMin: null, yearMax: null });
                        setExpanded(new Set());
                    } catch { alert('Invalid JSON file'); }
                };
                r.readAsText(file);
            };

            return React.createElement('div', { className: 'min-h-screen flex flex-col' },
                // Header

                        React.createElement('div', null,
                            React.createElement('h1', { className: 'text-lg font-bold' }, 'CJEU Legitimate Interest Analyzer'),
                            React.createElement('p', { className: 'text-xs text-zinc-500 mono' },
                                filteredCases.length, ' / ', allCases.length, ' cases'
                            )
                        ),
                        React.createElement('div', { className: 'flex items-center gap-3' },
                            React.createElement('div', { className: 'flex border border-zinc-700 rounded-lg overflow-hidden' },
                                [['browse', 'Browse'], ['report', 'Report']].map(([k, l]) =>
                                    React.createElement('button', {
                                        key: k,
                                        className: `px-4 py-2 text-sm transition-colors ${view === k ? 'bg-zinc-700 text-white' : 'text-zinc-400 hover:text-zinc-200'}`,
                                        onClick: () => { if (k === 'report') setShowReport(true); else setView(k); }
                                    }, l)
                                )
                            ),
                            React.createElement('label', { className: 'btn btn-primary cursor-pointer' },
                                'Load JSON',
                                React.createElement('input', { type: 'file', accept: '.json', onChange: upload, className: 'hidden' })
                            )
                        )
                    )
                ),

                // Main content
                React.createElement('main', { className: 'flex-1 max-w-[1600px] mx-auto w-full px-6 py-6' },
                    // Stats toggle
                    React.createElement('div', { className: 'flex justify-end mb-4' },
                        React.createElement('button', {
                            className: 'btn btn-ghost btn-sm',
                            onClick: () => setShowStats(!showStats)
                        }, showStats ? 'Hide Stats' : 'Show Stats')
                    ),

                    // Stats
                    showStats && React.createElement(StatsSummary, { cases: filteredCases }),

                    // Browse layout
                    React.createElement('div', { className: 'flex gap-6' },
                        // Sidebar
                        React.createElement('div', { className: 'w-72 flex-shrink-0 sticky top-24 self-start max-h-[calc(100vh-120px)] overflow-y-auto pr-2', style: { scrollbarWidth: 'thin' } },
                            React.createElement(FilterPanel, {
                                filters, setFilters,
                                cases: filteredCases, allCases
                            })
                        ),

                        // Main area
                        React.createElement('div', { className: 'flex-1 min-w-0' },
                            // Sort controls
                            React.createElement('div', { className: 'flex items-center gap-2 mb-4' },
                                React.createElement('span', { className: 'text-sm text-zinc-500' }, 'Sort:'),
                                [['date_asc', 'Date \u2191'], ['date_desc', 'Date \u2193'], ['case', 'Case #'], ['conclusion', 'Conclusion']].map(([k, l]) =>
                                    React.createElement('button', {
                                        key: k,
                                        className: `btn btn-sm ${sortBy === k ? 'btn-primary' : 'btn-ghost'}`,
                                        onClick: () => setSortBy(k)
                                    }, l)
                                )
                            ),

                            // Case cards
                            sortedCases.length === 0
                                ? React.createElement('div', { className: 'text-center py-16 text-zinc-500' },
                                    React.createElement('div', { className: 'text-lg mb-2' }, 'No cases match current filters'),
                                    React.createElement('button', { className: 'btn btn-ghost', onClick: () => setFilters({ search: '', conclusions: [], sides: [], bools: {}, yearMin: null, yearMax: null }) }, 'Clear all filters')
                                  )
                                : sortedCases.map(c => React.createElement(CaseCard, {
                                    key: c.case_number,
                                    c: c,
                                    expanded: expanded.has(c.case_number),
                                    onToggle: () => toggle(c.case_number)
                                  }))
                        )
                    )
                ),

                // Report Builder Modal
                React.createElement(ReportBuilder, {
                    cases: filteredCases,
                    allCases,
                    isOpen: showReport,
                    onClose: () => setShowReport(false)
                })
            );
        };

        ReactDOM.render(React.createElement(App), document.getElementById('root'));
    </script>
</body>
</html>
